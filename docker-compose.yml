services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local_root_password
      MYSQL_DATABASE: marine_parts
      MYSQL_USER: marine_app
      MYSQL_PASSWORD: local_dev_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  flask:
    build:
      context: .
      dockerfile: Dockerfile.flask
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: marine_app
      DB_PASSWORD: local_dev_password
      DB_NAME: marine_parts
    ports:
      - "8001:8000"
    depends_on:
      mysql:
        condition: service_healthy

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: marine_app
      DB_PASSWORD: local_dev_password
      DB_NAME: marine_parts
    ports:
      - "8002:8000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
